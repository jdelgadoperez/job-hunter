name: Labels

# Syncs the backlog labels declared in .github/labels.json onto the repo. Creates missing labels
# and updates the color/description of existing ones; never deletes labels that aren't listed.

on:
  push:
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read # checkout; required on private repos once permissions are set explicitly
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r '.name' <<<"$label")
            gh label create "$name" \
              --color "$(jq -r '.color' <<<"$label")" \
              --description "$(jq -r '.description' <<<"$label")" \
              --force
            echo "synced: $name"
          done
